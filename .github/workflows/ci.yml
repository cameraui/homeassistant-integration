name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Find the Python of the oldest core in hacs.json
        id: floor
        run: |
          core=$(jq -r '.homeassistant // empty' hacs.json)
          if [[ -z $core ]]; then
            echo "::error file=hacs.json::hacs.json sets no homeassistant version"
            exit 1
          fi
          python=$(curl -fsSL "https://pypi.org/pypi/homeassistant/$core/json" \
            | jq -r .info.requires_python \
            | sed -E 's/^[^0-9]*([0-9]+\.[0-9]+).*/\1/')
          [[ $python =~ ^[0-9]+\.[0-9]+$ ]]
          echo "Home Assistant $core runs on Python $python"
          echo "python=$python" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.floor.outputs.python }}

      - name: Parse every module
        run: python -m compileall -q custom_components

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest
